<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#121212;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.calculator{
    background:#1e1e1e;
    padding:20px;
    border-radius:25px;
    width:340px;
    box-shadow:0 0 25px rgba(255,255,255,0.1);
}

#display{
    width:100%;
    height:80px;
    background:#000;
    color:white;
    border:none;
    border-radius:15px;
    text-align:right;
    padding:15px;
    font-size:35px;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:70px;
    border:none;
    border-radius:50%;
    font-size:24px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.number{
    background:#333;
    color:white;
}

.operator{
    background:#ff9500;
    color:white;
}

.function{
    background:#a5a5a5;
    color:black;
}

.equal{
    background:#34c759;
    color:white;
}
</style>
</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button class="function" onclick="clearDisplay()">AC</button>
<button class="function" onclick="deleteLast()">⌫</button>
<button class="function" onclick="append('%')">%</button>
<button class="operator" onclick="append('/')">÷</button>

<button class="number" onclick="append('7')">7</button>
<button class="number" onclick="append('8')">8</button>
<button class="number" onclick="append('9')">9</button>
<button class="operator" onclick="append('*')">×</button>

<button class="number" onclick="append('4')">4</button>
<button class="number" onclick="append('5')">5</button>
<button class="number" onclick="append('6')">6</button>
<button class="operator" onclick="append('-')">−</button>

<button class="number" onclick="append('1')">1</button>
<button class="number" onclick="append('2')">2</button>
<button class="number" onclick="append('3')">3</button>
<button class="operator" onclick="append('+')">+</button>

<button class="number" onclick="append('0')">0</button>
<button class="number" onclick="append('.')">.</button>
<button class="equal" style="grid-column:span 2;border-radius:40px;" onclick="calculate()">=</button>

</div>

</div>

<script>

let display=document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value="";
}

function deleteLast(){
    display.value=display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value=eval(display.value);
    }catch{
        display.value="Error";
    }
}

</script>

</body>
</html>
